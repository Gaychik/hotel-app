{% extends "base.html" %}
{% block title %}Создать номер - Admin{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <h1 class="text-4xl font-bold font-karantina mb-2">Создать номер</h1>
        <p class="text-gray-600">Добавление нового номера в систему</p>
    </div>
    
    <form method="POST" action="/admin/rooms/create" class="bg-white rounded-2xl shadow-lg p-8 space-y-6">
        <!-- Основная информация -->
        <div class="space-y-4">
            <h2 class="text-2xl font-bold font-source-serif-pro">Основная информация</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Название *</label>
                    <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg" placeholder="Например: Люкс с видом на море">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Вместимость *</label>
                    <input type="number" name="capacity" required min="1" class="w-full px-4 py-2 border rounded-lg" placeholder="2">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Описание *</label>
                <textarea name="description" required rows="4" class="w-full px-4 py-2 border rounded-lg" placeholder="Подробное описание номера..."></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Цена за ночь (₽) *</label>
                    <input type="number" name="price" required min="0" class="w-full px-4 py-2 border rounded-lg" placeholder="12500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Скидка (%)</label>
                    <input type="number" name="discount_percent" min="0" max="100" value="0" class="w-full px-4 py-2 border rounded-lg">
                </div>
            </div>
        </div>
        
        <!-- Изображения -->
        <div class="space-y-4">
            <h2 class="text-2xl font-bold font-source-serif-pro">Изображения</h2>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">URL изображений (через запятую)</label>
                <input type="text" name="images" class="w-full px-4 py-2 border rounded-lg" placeholder="/images/room1.jpg, /images/room2.jpg">
            </div>
        </div>
        
        <!-- Удобства -->
        <div class="space-y-4">
            <h2 class="text-2xl font-bold font-source-serif-pro">Удобства</h2>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Удобства (через запятую)</label>
                <input type="text" name="amenities" class="w-full px-4 py-2 border rounded-lg" placeholder="Wi-Fi, Кондиционер, Телевизор, Мини-бар">
            </div>
        </div>
        
        <!-- Правила -->
        <div class="space-y-4">
            <h2 class="text-2xl font-bold font-source-serif-pro">Правила проживания</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Заезд</label>
                    <input type="text" name="checkIn" value="14:00" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Выезд</label>
                    <input type="text" name="checkOut" value="12:00" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Отмена бронирования</label>
                    <input type="text" name="cancellation" value="Бесплатная отмена за 24 часа" class="w-full px-4 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Размещение с животными</label>
                    <input type="text" name="pets" value="Запросить у администратора" class="w-full px-4 py-2 border rounded-lg">
                </div>
            </div>
        </div>
        
        <!-- Статус -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Статус</label>
            <select name="status" class="w-full px-4 py-2 border rounded-lg">
                <option value="active">Активен</option>
                <option value="inactive">Неактивен</option>
                <option value="maintenance">На обслуживании</option>
            </select>
        </div>
        
        <div class="flex gap-4 pt-4">
            <button type="submit" class="flex-1 bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-700">Создать номер</button>
            <a href="/admin/rooms" class="px-6 py-3 border border-gray-300 rounded-lg text-center hover:bg-gray-50">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
